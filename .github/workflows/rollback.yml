name: rollback

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to redeploy (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Resolve image digest
        id: image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image:$RELEASE_TAG"
          image_ref="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image:$RELEASE_TAG")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image:$RELEASE_TAG")"
          test -n "$image_ref"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Connect to production tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ secrets.PROD_TAILSCALE_HOST }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Redeploy selected release
        shell: bash
        env:
          PROD_TAILSCALE_HOST: ${{ secrets.PROD_TAILSCALE_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ steps.image.outputs.revision }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_TAILSCALE_HOST" \
            "deploy $RELEASE_TAG $RELEASE_SHA $IMAGE_REF"

      - name: Validate public endpoint
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_URL"
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "${PRODUCTION_URL%/}/health"
