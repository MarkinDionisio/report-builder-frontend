services:
  frontend:
    image: ${REPORT_BUILDER_FRONTEND_IMAGE:-report-builder-frontend:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://reportsapi.fabricasistemas.com.br}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

